<div class="layout">
  <app-header [isSidebarOpen]="isSidebarOpen" (sidebarToggleRequested)="toggleSidebar()"></app-header>

  <div class="body-layout">
    <app-sidebar [isOpen]="isSidebarOpen" (closeRequested)="closeSidebar()"></app-sidebar>

    <main class="content">
      <mat-card class="settings-card" appearance="outlined">
      <h1>{{ 'settings.title' | translate }}</h1>
      <p>{{ 'settings.subtitle' | translate }}</p>

      <mat-form-field appearance="outline" class="language-field">
        <mat-label>{{ 'settings.languageLabel' | translate }}</mat-label>
        <mat-select [value]="currentLanguage" (selectionChange)="onLanguageChange($event.value)">
          <mat-option value="en">{{ 'settings.languageEnglish' | translate }}</mat-option>
          <mat-option value="es">{{ 'settings.languageSpanish' | translate }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-flat-button color="warn" [disabled]="isLoggingOut" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <mat-spinner *ngIf="isLoggingOut" diameter="16" class="logout-spinner"></mat-spinner>
        {{ isLoggingOut ? ('settings.loggingOut' | translate) : ('settings.logoutButton' | translate) }}
      </button>

        <p class="status" *ngIf="statusMessage">{{ statusMessage }}</p>
      </mat-card>
    </main>
  </div>
</div>
